[workspace]
members = ["crates/muxpilot"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/muxpilot/muxpilot"

[workspace.dependencies]
crossterm = "0.29.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = { version = "0.8.19", default-features = false, features = ["parse"] }
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }
unicode-width = "0.2.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# The @agentvibes/guardrails Clippy canon, written by guardrails init.
# CI runs clippy with -D warnings. README "Rust" in @agentvibes/guardrails gives the reasons.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Whole groups at warn, under every single lint (priority -1), so a single
# lint below can still be raised to deny. CI runs clippy with -D warnings,
# so a warning fails the build all the same.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Restriction lints: these are off in Clippy by default.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
