name: Web

# Builds the marketing site (apps/web, a static export) and deploys it to
# Cloudflare Workers static assets on muxpilot.byokapi.com.
# Public repo: GitHub-hosted runners only.
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "crates/muxpilot/Cargo.toml"
      - "turbo.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "crates/muxpilot/Cargo.toml"
      - "turbo.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@muxpilot/web
      # No token needed: reads the assets directory and the config, uploads nothing.
      - name: Dry-run the Worker deploy
        if: github.event_name == 'pull_request'
        run: pnpm --filter @muxpilot/web exec wrangler deploy --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          retention-days: 7

  deploy-cloudflare:
    needs: build
    # Off until the repo has the Cloudflare secrets: set the repo variable CLOUDFLARE_DEPLOY=on
    # and the secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
    if: ${{ github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY == 'on' }}
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@muxpilot/web
      - run: pnpm --filter @muxpilot/web run deploy:cloudflare
